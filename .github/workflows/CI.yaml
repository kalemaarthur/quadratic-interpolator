
name: RTL Simulation and Verification


on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Quadratic Accelerator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run RTL simulation
        run: make sim

      - name: Run numerical verification
        run: make verify


      - name: Run generic hardware synthesis
        run: make synth

      - name: Install simulation and synthesis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          iverilog -V | head -n 1
          yosys -V


