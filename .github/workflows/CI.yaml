
name: RTL Simulation and Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Quadratic Accelerator
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install ALL required tools
      - name: Install simulation and synthesis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          iverilog -V | head -n 1
          yosys -V

      # Step 3: Run RTL simulation
      - name: Run RTL simulation
        run: make sim

      # Step 4: Verify numerical accuracy
      - name: Run numerical verification
        run: make verify

      # Step 5: Synthesize hardware
      - name: Run generic hardware synthesis
        run: make synth
